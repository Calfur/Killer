<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Game</title>
  <script src="./script.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <div class="masthead-inner">
        <h1>Create a New Killer Game</h1>
      </div>
    </header>

    <main class="content">
      <section class="panel">
        <form id="createForm">
          <label for="players">Enter player names (comma separated):</label>
          <input type="text" id="players" required />
          <button type="submit">Create Game</button>
        </form>

        <p id="createMessage" class="message" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script>
    initSubmitCreateForm();
  </script>
</body>
</html>
