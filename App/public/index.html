<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Killer Game</title>
  <script src="./script.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <div class="masthead-inner">
        <h1>Killer Game</h1>
      </div>
    </header>

    <main class="content">
      <section class="panel" aria-labelledby="player-heading">
        <h3 id="player-heading">Wähle deinen Namen</h3>
        <form id="playerForm" class="player-form">
          <div class="select-wrap">
            <select id="playerDropdown" aria-labelledby="player-heading">
              <option value=""></option>
            </select>
          </div>
          <button type="submit">Opfer anzeigen</button>
        </form>

        <p id="victimMessage" class="message" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script>
    fetchPlayers();
    initSubmitPlayerForm();
  </script>
</body>
</html>
