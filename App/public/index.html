<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Killer Game</title>
  <script src="./player-picker.js"></script>
  <script src="./script.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <div class="masthead-inner">
        <h1>Killer Game</h1>
      </div>
    </header>

    <main class="content">
      <section class="panel" aria-labelledby="player-heading">
        <h3 id="player-heading">Wähle deinen Namen</h3>
        <form id="playerForm" class="player-form">
          <div class="select-wrap">
            <button id="playerDropdown" class="player-picker" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="playerOptions"
              aria-labelledby="player-heading playerSelection">
              <span id="playerSelection"></span>
            </button>
            <ul id="playerOptions" class="player-options" role="listbox"
              aria-labelledby="player-heading" hidden></ul>
          </div>
          <button type="submit">Opfer anzeigen</button>
        </form>

        <p id="victimMessage" class="message" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script>
    fetchPlayers();
    initSubmitPlayerForm();
  </script>
</body>
</html>
